<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hashtag Trends</title>

    <!-- Bootstrap CDN for responsive design and nice components -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            background-color: #f5f7fa;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group input {
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
        }

        .button {
            background-color: #007bff;
            color: white;
            font-size: 1rem;
            border-radius: 5px;
            padding: 12px;
            width: 100%;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #0056b3;
        }

        .card {
            margin-top: 30px;
        }

        .back-button {
            margin-top: 20px;
            text-decoration: none;
            color: #007bff;
        }

        .back-button:hover {
            color: #0056b3;
        }

        .graph-container {
            text-align: center;
            margin-top: 20px;
        }

        .alert {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Trending Hashtags</h1>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-info">
              {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form action="{{ url_for('hashtag_trends') }}" method="POST">
            <div class="form-group">
                <label for="hashtag">Enter a hashtag to track:</label>
                <input type="text" class="form-control" id="hashtag" name="hashtag" placeholder="#hashtag" required />
            </div>
            <button type="submit" class="button">Track Hashtag</button>
        </form>

        {% if graph_url %}
        <div class="graph-container">
            <h3>Popularity of #{{ hashtag }} Over Time</h3>
            <img src="data:image/png;base64,{{ graph_url }}" alt="Hashtag Trend Graph" class="img-fluid" />
        </div>
        {% else %}
        <div class="graph-container">
            <p>No graph available yet. Please enter a hashtag to track.</p>
        </div>
        {% endif %}

        <a href="{{ url_for('dashboard') }}" class="back-button">Back to Dashboard</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
